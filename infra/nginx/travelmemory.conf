# /etc/nginx/sites-available/default on every FRONTEND instance (baked into the frontend AMI)
#   /      -> React app served by pm2 on localhost:3000
#   /trip  -> Node.js API through the INTERNAL backend ALB on port 3001
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /trip {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://internal-my-app-backend-alb-730574711.ap-south-1.elb.amazonaws.com:3001;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://localhost:3000;
    }
}
